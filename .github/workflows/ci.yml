name: CI - Build and Release APK

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0) — leave empty to read from pubspec.yaml'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      # ── Resolve version ──────────────────────────────────────────────────────
      - name: Resolve version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml \
              | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "▶ Resolved version: $VERSION"

      # ── Signing setup ────────────────────────────────────────────────────────
      - name: Setup signing
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            cat >> android/local.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "▶ Signed build enabled"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "▶ No keystore — unsigned build"
          fi

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build APK (Debug)
        if: >
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/tags/') &&
          github.event_name != 'workflow_dispatch'
        run: flutter build apk --debug

      - name: Build APK (Release — split per ABI)
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        run: flutter build apk --release --split-per-abi

      - name: Build APK (Release — universal)
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        run: flutter build apk --release

      # ── Rename APKs ──────────────────────────────────────────────────────────
      - name: Rename APK files
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DIR="build/app/outputs/flutter-apk"
          cd "$DIR"
          for ARCH in arm64-v8a armeabi-v7a x86_64; do
            SRC="app-${ARCH}-release.apk"
            DST="wandermind-llm-v${VERSION}-${ARCH}.apk"
            [ -f "$SRC" ] && mv "$SRC" "$DST" && echo "  ✔ $DST"
          done
          [ -f "app-release.apk" ] && \
            mv app-release.apk "wandermind-llm-v${VERSION}-universal.apk" && \
            echo "  ✔ wandermind-llm-v${VERSION}-universal.apk"
          ls -lah

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload debug APK
        if: >
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/tags/') &&
          github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload release APKs
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-v${{ steps.get_version.outputs.version }}
          path: build/app/outputs/flutter-apk/wandermind-llm-*.apk
          retention-days: 30

      # ── Release notes ────────────────────────────────────────────────────────
      - name: Generate release notes
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          SIGNED="${{ steps.signing.outputs.signed }}"
          [ "$SIGNED" = "true" ] && SIGN_NOTE="✅ Signed release" || SIGN_NOTE="⚠️ Unsigned release"

          cat > release_notes.md << EOF
          ## 🎉 WanderMind LLM v${VERSION}
          **Your Personal AI Travel Assistant — Works 100% Offline**
          ${SIGN_NOTE}

          ### 📦 Pick the right APK
          | File | For |
          |------|-----|
          | \`*-arm64-v8a.apk\` | Most modern Android phones ✅ recommended |
          | \`*-armeabi-v7a.apk\` | Older 32-bit ARM devices |
          | \`*-x86_64.apk\` | Intel/AMD devices & emulators |
          | \`*-universal.apk\` | Any device — larger file size |

          ### 🔧 Build info
          - Flutter 3.24.0 · Dart 3.x
          - Min SDK 24 (Android 7.0) · Target SDK 34 (Android 14)

          ### 📝 Changes
          EOF

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "#### Since \`${PREV_TAG}\`" >> release_notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> release_notes.md
          else
            echo "#### Recent commits" >> release_notes.md
            git log -15 --pretty=format:"- %s (%h)" >> release_notes.md
          fi
          echo -e "\n\n---\nBuilt automatically with GitHub Actions ❤️" >> release_notes.md

      # ── Auto-tag ─────────────────────────────────────────────────────────────
      - name: Auto-tag if needed
        if: >
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
          !startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "▶ Tag v${VERSION} already exists — skipping"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
            echo "✅ Tag v${VERSION} pushed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: WanderMind LLM v${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          files: build/app/outputs/flutter-apk/wandermind-llm-*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
