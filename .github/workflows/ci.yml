name: CI - Build and Release APK

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build APK (Debug)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --debug

      - name: Build APK (Release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release --split-per-abi

      - name: Build APK (Release - Universal)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release

      - name: Rename APK files
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cd build/app/outputs/flutter-apk
          
          if [ -f "app-arm64-v8a-release.apk" ]; then
            mv app-arm64-v8a-release.apk wandermind-llm-v${VERSION}-arm64-v8a.apk
          fi
          
          if [ -f "app-armeabi-v7a-release.apk" ]; then
            mv app-armeabi-v7a-release.apk wandermind-llm-v${VERSION}-armeabi-v7a.apk
          fi
          
          if [ -f "app-x86_64-release.apk" ]; then
            mv app-x86_64-release.apk wandermind-llm-v${VERSION}-x86_64.apk
          fi
          
          if [ -f "app-release.apk" ]; then
            mv app-release.apk wandermind-llm-v${VERSION}-universal.apk
          fi
          
          ls -lah

      - name: Upload APK artifacts (Debug)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload APK artifacts (Release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          cat > release_notes.md << 'EOF'
          ## 🎉 WanderMind LLM v$VERSION
          
          ### 📱 What's New
          
          This release includes bug fixes, performance improvements, and new features for offline travel planning with AI.
          
          ### ✨ Features
          - Offline LLM-powered travel recommendations
          - Interactive route planning with offline maps
          - Travel plan creation and management
          - Chat interface for travel queries
          
          ### 📦 Downloads
          
          Choose the APK that matches your device architecture:
          
          - **arm64-v8a**: Modern 64-bit ARM devices (recommended for most phones)
          - **armeabi-v7a**: Older 32-bit ARM devices
          - **x86_64**: Intel/AMD 64-bit devices (emulators, tablets)
          - **universal**: Works on all devices (larger file size)
          
          ### 🔧 Technical Details
          
          - Flutter Version: 3.24.0
          - Min SDK: 21 (Android 5.0)
          - Target SDK: 34 (Android 14)
          
          ### 📝 Changelog
          
          EOF
          
          if git tag --list | grep -q "$(git describe --tags --abbrev=0 2>/dev/null)"; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "#### Commits since $PREV_TAG:" >> release_notes.md
              git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> release_notes.md
            else
              echo "#### Recent commits:" >> release_notes.md
              git log -10 --pretty=format:"- %s (%h)" >> release_notes.md
            fi
          else
            echo "#### Recent commits:" >> release_notes.md
            git log -10 --pretty=format:"- %s (%h)" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "Built with ❤️ using Flutter" >> release_notes.md
          
          cat release_notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-tag:
    name: Auto Tag on Main Branch
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version from pubspec.yaml: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} does not exist"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger release workflow
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "Tag created successfully. Release workflow will be triggered automatically."
