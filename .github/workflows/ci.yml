name: CI - Build and Release APK

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (e.g. 1.2.0) — leave empty to read from pubspec.yaml'
        required: false
        default: ''
      force_release:
        description: 'Force create a GitHub Release even if tag already exists'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Resolve version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml \
              | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "▶ Resolved version: $VERSION"

      - name: Build APK (Debug)
        if: >
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/tags/') &&
          github.event_name != 'workflow_dispatch'
        run: flutter build apk --debug

      - name: Build APK (Release — split per ABI)
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        run: flutter build apk --release --split-per-abi

      - name: Build APK (Release — universal)
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        run: flutter build apk --release

      - name: Rename APK files
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          DIR="build/app/outputs/flutter-apk"
          cd "$DIR"

          for ARCH in arm64-v8a armeabi-v7a x86_64; do
            SRC="app-${ARCH}-release.apk"
            DST="wandermind-llm-v${VERSION}-${ARCH}.apk"
            [ -f "$SRC" ] && mv "$SRC" "$DST" && echo "  renamed → $DST"
          done

          if [ -f "app-release.apk" ]; then
            mv app-release.apk "wandermind-llm-v${VERSION}-universal.apk"
            echo "  renamed → wandermind-llm-v${VERSION}-universal.apk"
          fi

          echo "── APK directory ──"
          ls -lah

      - name: Upload debug APK
        if: >
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/tags/') &&
          github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload release APKs
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-v${{ steps.get_version.outputs.version }}
          path: build/app/outputs/flutter-apk/wandermind-llm-*.apk
          retention-days: 30

      - name: Generate release notes
        if: >
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          cat > release_notes.md << EOF
          ## 🎉 WanderMind LLM v${VERSION}

          **Your Personal AI Travel Assistant — Works 100% Offline**

          ### ✨ Highlights
          - On-device LLM powered by Llama.cpp (no cloud, no API key)
          - Smart offline routing with scenic path optimization
          - Turn-by-turn voice navigation
          - Day-by-day AI itinerary generation

          ### 📦 Pick the right APK

          | File | For |
          |------|-----|
          | \`*-arm64-v8a.apk\` | Most modern Android phones (recommended) |
          | \`*-armeabi-v7a.apk\` | Older 32-bit ARM devices |
          | \`*-x86_64.apk\` | Intel/AMD devices & emulators |
          | \`*-universal.apk\` | Any device — larger size |

          ### 🔧 Build info
          - Flutter 3.24.0 · Dart 3.x
          - Min SDK 24 (Android 7.0) · Target SDK 34 (Android 14)

          ### 📝 Changes
          EOF

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "#### Commits since \`${PREV_TAG}\`" >> release_notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> release_notes.md
          else
            echo "#### Recent commits" >> release_notes.md
            git log -15 --pretty=format:"- %s (%h)" >> release_notes.md
          fi

          echo -e "\n\n---\nBuilt automatically with GitHub Actions ❤️" >> release_notes.md
          cat release_notes.md

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/') ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: WanderMind LLM v${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          files: build/app/outputs/flutter-apk/wandermind-llm-*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════════
  # Auto-tag job: runs after build on main, creates a vX.Y.Z tag which then
  # re-triggers this workflow and causes the Release to be created.
  # ════════════════════════════════════════════════════════════════════════════
  auto-tag:
    name: Auto-tag on main
    runs-on: ubuntu-latest
    # Only on direct pushes to main (not on PRs, not on tag pushes, not on
    # workflow_dispatch — that path already creates the release directly above)
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml \
            | sed 's/version: //' | tr -d ' ' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "▶ Version: $VERSION"

      - name: Check whether tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" \
               >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} not found — will create."
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          echo "✅ Tag v${{ steps.version.outputs.version }} pushed."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
