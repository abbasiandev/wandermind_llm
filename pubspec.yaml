name: wandermind_llm
description: An offline AI-powered travel smart planner using local LLM
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  material_icons_named: ^1.0.2

  # Riverpod
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  dio: ^5.3.2
  connectivity_plus: ^5.0.1

  # llama_cpp_dart: ^0.2.1  # Removed - using native Android implementation
  # ffi: ^2.1.0  # Not needed with platform channels

  geolocator: ^13.0.2
  geocoding: ^2.1.1

  # Free map alternative using OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Text to speech for voice navigation
  flutter_tts: ^3.8.5
  
  # Environment variables
  flutter_dotenv: ^5.1.0
  
  # HTTP client
  http: ^1.1.0

  intl: ^0.18.1
  uuid: ^4.1.0
  logger: ^2.0.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  image_picker: ^1.0.4
  cached_network_image: ^3.3.0

  permission_handler: ^11.0.1

  go_router: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
    - assets/models/
    - assets/data/
    # Optional — uncomment after creating .env with MAPBOX_ACCESS_TOKEN:
    # - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
